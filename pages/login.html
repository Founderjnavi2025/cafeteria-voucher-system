
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Debug — CVS</title>

  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />

  <script>
    window.__ENV__ = window.__ENV__ || {};
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/supabaseClient.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
</head>

<body>
  <div class="auth-layout">
    <div class="card auth-card">

      <h1>Cafeteria Voucher System</h1>
      <p class="text-muted text-sm">Login — Auth Diagnostic</p>

      <form id="login-form">
        <div class="form-row">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            required
            autocomplete="username"
          />
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
          />
        </div>

        <button
          type="submit"
          class="btn btn-primary btn-block"
          id="btn-login"
        >
          Tes Login
        </button>
      </form>

      <div id="debug-result"
           style="margin-top:20px; padding:12px; border-radius:8px; background:#eee; color:#222; white-space:pre-wrap; overflow-wrap:anywhere;">
        Menunggu pengujian...
      </div>

      <p class="text-xs text-muted text-center mt-4">
        CVS v<span id="app-version"></span>
      </p>

    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const btn = document.getElementById('btn-login');
    const output = document.getElementById('debug-result');

    document.getElementById('app-version').textContent =
      CVS_CONFIG.APP_VERSION;

    function showResult(title, detail) {
      output.textContent =
        title + '\n\n' + detail;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email =
        document.getElementById('email').value.trim();

      const password =
        document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = 'Menghubungi Supabase...';

      showResult('SEDANG TES AUTH', 'Mohon tunggu...');

      try {
        if (!window.cvsSupabase) {
          throw new Error('Supabase client tidak ditemukan.');
        }

        const { data, error } =
          await window.cvsSupabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        showResult(
          'AUTH BERHASIL',
          'Email: ' + (data.user?.email || '-') +
          '\nUser ID: ' + (data.user?.id || '-') +
          '\n\nSupabase Auth berhasil.' +
          '\nQuery profiles belum dijalankan.' +
          '\nRole belum diperiksa.' +
          '\nDashboard belum dibuka.'
        );

        console.log('[CVS DEBUG] Auth success', data.user);

      } catch (error) {
        showResult(
          'AUTH GAGAL',
          'Pesan: ' + (error.message || String(error)) +
          '\nKode: ' + (error.code || '-') +
          '\nStatus: ' + (error.status || '-')
        );

        console.error('[CVS DEBUG] Auth error', error);

      } finally {
        btn.disabled = false;
        btn.textContent = 'Tes Login';
      }
    });
  </script>
</body>
</html>

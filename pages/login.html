<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — CVS</title>
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/components.css" />
  <link rel="stylesheet" href="/assets/css/layout.css" />
  <script>
    window.__ENV__ = window.__ENV__ || {};
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/supabaseClient.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/debug.js"></script>
</head>
<body>
  <div class="auth-layout">
    <div class="card auth-card">
      <h1 style="margin-bottom:.25rem">Cafeteria Voucher System</h1>
      <p class="text-muted text-sm mb-4">Login administrator / operator.</p>

      <form id="login-form">
        <div class="form-row">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Masuk</button>
      </form>

      <p class="text-xs text-muted text-center mt-4">
        CVS v<span id="app-version"></span>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('app-version').textContent = CVS_CONFIG.APP_VERSION;

    (async () => {
      const s = await CVSAuth.getSession();
      if (s) window.location.replace('/dashboard');
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      btn.disabled = true;
      btn.textContent = 'Memproses…';
      CVSUI.showLoading(true);
      try {
        await CVSAuth.login(email, password);
        window.location.replace('/dashboard');
      } catch (err) {
        CVSUI.toast(err.message || 'Login gagal', 'error');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      } finally {
        CVSUI.showLoading(false);
      }
    });
  </script>
</body>
</html>

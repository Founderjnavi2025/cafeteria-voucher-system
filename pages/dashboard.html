
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Diagnostic — CVS</title>

  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/layout.css">

  <style>
    #boot-status {
      margin: 16px;
      padding: 16px;
      background: #fff;
      color: #222;
      border: 2px solid #64748b;
      border-radius: 10px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: 13px/1.6 monospace;
    }
    #app { min-height: 100vh; }
  </style>

  <script>
    window.__ENV__ = window.__ENV__ || {};
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/supabaseClient.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/ui.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/app-shell.js"></script>
</head>

<body>

  <div id="boot-status">CVS: Memulai dashboard...</div>
  <div id="app"></div>

  <script>
    const statusBox = document.getElementById('boot-status');

    function status(message) {
      statusBox.textContent += '\n' + message;
    }

    window.addEventListener('error', function (event) {
      status(
        '\nJAVASCRIPT ERROR:\n' +
        event.message +
        '\nFile: ' + event.filename +
        '\nLine: ' + event.lineno
      );
    });

    window.addEventListener('unhandledrejection', function (event) {
      status(
        '\nPROMISE ERROR:\n' +
        (event.reason?.stack || event.reason?.message || String(event.reason))
      );
    });

    async function startDashboard() {
      try {
        status('1. Memeriksa konfigurasi...');

        if (!window.CVS_CONFIG) {
          throw new Error('CVS_CONFIG tidak ditemukan');
        }

        status('2. Memeriksa Supabase client...');

        if (!window.cvsSupabase) {
          throw new Error('Supabase client tidak tersedia');
        }

        status('3. Memeriksa CVSAuth...');

        if (!window.CVSAuth) {
          throw new Error('CVSAuth tidak tersedia');
        }

        status('4. Memeriksa CVSUI...');

        if (!window.CVSUI) {
          throw new Error('CVSUI tidak tersedia');
        }

        status('5. Memeriksa CVSUtils...');

        if (!window.CVSUtils) {
          throw new Error('CVSUtils tidak tersedia');
        }

        status('6. Memeriksa CVSAppShell...');

        if (!window.CVSAppShell) {
          throw new Error('CVSAppShell tidak tersedia');
        }

        status('7. Menjalankan App Shell...');

        await window.CVSAppShell.mount({
          title: 'Dashboard',
          requiredRoles: ['admin', 'operator', 'viewer'],

          onReady: async function (profile) {
            status(
              '8. App Shell berhasil.\n' +
              'Email: ' + profile.email +
              '\nRole: ' + profile.role
            );

            const main = document.getElementById('main-content');

            if (!main) {
              throw new Error('main-content tidak ditemukan');
            }

            main.innerHTML =
              '<div class="card">' +
              '<h2>Dashboard CVS</h2>' +
              '<p>Login berhasil.</p>' +
              '<p>Pengguna: ' + CVSUI.escapeHtml(profile.email) + '</p>' +
              '<p>Role: ' + CVSUI.escapeHtml(profile.role) + '</p>' +
              '</div>';

            status('9. Tampilan dashboard berhasil dibuat.');
            statusBox.style.display = 'none';
          }
        });

      } catch (error) {
        status(
          '\nDASHBOARD ERROR:\n' +
          (error.stack || error.message || String(error))
        );
      }
    }

    startDashboard();
  </script>

</body>
</html>
